<html>
    <head>
        <title>AgeChecker</title>
        <Style>
            
            .data{
                 justify-content: center;
                flex-direction: row;
                align-items: center;
               
                height: 50px;
                width: 300px;
                background-color: rgb(222, 159, 76);
                border: 2px solid rgb(2, 2, 128) ;
                padding: 5px;
            }
            input{
                background-color: rgb(250, 237, 220);
            }
            #result 
             { font-weight: bold;
                 margin-top: 10px; 
                 color: rgb(70, 40, 1);
            }
            button{
                height: 30px;
                width: 60px;
                background-color: rgb(239, 192, 132);
                color: rgb(70, 40, 1);
            }
        </Style>
    </head>
    <body>
        <div>
            <div class="data">
                <label for="name">Enter Your Name: </label>
                <input type="text" id="name">
            </div>
            <p class="result"></p>

            <div class="data">
                <label for="age">Enter Your Age: </label>
                <input type="number" id="age">
            </div>
            <p id="result"></p>

            <button onclick="verifyy()">Check</button>
        
         </div>   
        
        <script src="AgeChecker.js"></script>
    </body>
