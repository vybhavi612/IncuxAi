<!DOCTYPE html>
<html>
<head>

<title>Student Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-danger text-white">

<h2>Student Login</h2>

</div>

<div class="card-body">

<div class="text-center mb-4">

<img
id="profilePreview"
src="https://via.placeholder.com/150"
width="150"
height="150"
class="rounded-circle border">

</div>

<div class="text-center">

<h5>Capture Attendance Photo</h5>

<video
id="video"
width="400"
height="300"
autoplay
class="border"
style="transform: scaleX(-1);">
</video>

<br><br>

<button
type="button"
class="btn btn-primary"
onclick="capturePhoto()">

Capture Photo

</button>

</div>

<hr>

<form id="loginForm">

<div class="mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
class="form-control"
required>

</div>

<button
type="submit"
class="btn btn-danger w-100">

LOGIN

</button>

<div class="text-center mt-3">

<p>
Don't have an account?
</p>

<a
href="register.html"
class="btn btn-primary">

Register Now

</a>

</div>

</form>

<canvas
id="canvas"
width="400"
height="300"
style="display:none;">
</canvas>

</div>

</div>

</div>

<script>

/* Every login requires a fresh photo */

localStorage.removeItem("studentPhoto");

let photoCaptured = false;

const video =
document.getElementById("video");

navigator.mediaDevices
.getUserMedia({
video:true
})
.then(function(stream){

video.srcObject = stream;

})
.catch(function(error){

console.log(error);

alert("Camera Access Denied");

});

function capturePhoto(){

const canvas =
document.getElementById("canvas");

const context =
canvas.getContext("2d");

context.save();

context.scale(-1,1);

context.drawImage(
video,
-400,
0,
400,
300
);

context.restore();

const imageData =
canvas.toDataURL("image/png");

document.getElementById(
"profilePreview"
).src = imageData;

localStorage.setItem(
"studentPhoto",
imageData
);

photoCaptured = true;

alert(
"Photo Captured Successfully"
);

}

document
.getElementById("loginForm")
.addEventListener(
"submit",
function(e){

e.preventDefault();

if(!photoCaptured){

alert(
"Please capture your photo before login"
);

return;

}

const loginTime = new Date();

localStorage.setItem(
"loginTime",
loginTime
);

window.location.href =
"dashboard.html";

});

</script>

</body>
</html>
