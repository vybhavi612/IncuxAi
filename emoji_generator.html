<!DOCTYPE html>
<html>
<body>

<h2>Emoji Generator</h2>

<p id="emoji">😀</p>

<button onclick="showEmoji()">New Emoji</button>

<script>
function showEmoji() {
  let emojis = ["😀", "😂", "😍", "😎", "🥳"];
  let random = Math.floor(Math.random() * emojis.length);
  document.getElementById("emoji").innerHTML = emojis[random];
}
</script>

</body>
</html>
