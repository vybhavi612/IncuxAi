<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <style>
    .board {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .column {
      width: 45%;
      border: 1px solid #ccc;
      padding: 12px;
      min-height: 220px;
      border-radius: 8px;
    }
    #todo { background: #fafafa; }
    #done { background: #f6fff6; }

    .card {
      padding: 10px;
      margin: 10px 0;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: grab;
      user-select: none;
    }
  </style>
</head>
<body>
  <h2>Kanban Board</h2>

  <div class="board">
    <div id="todo" class="column">
      <h2>To Do</h2>
    </div>

    <div id="done" class="column">
      <h2>Done</h2>
    </div>
  </div>

  <div style="margin-top: 16px;">
    <input id="task" placeholder="Enter task" />
    <button type="button" onclick="createTask()">Add Task</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
