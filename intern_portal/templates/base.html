<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intern Management - Member 2 Module</title>

    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    
    <style>
        .menu-container {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .vertical-menu-btn {
            display: block; 
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 10px;
            color: #212529;
            text-decoration: none !important;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .vertical-menu-btn:last-child {
            margin-bottom: 0;
        }
        .vertical-menu-btn:hover {
            background-color: #e9ecef;
            color: #0d6efd;
            padding-left: 25px;
        }
        .vertical-menu-btn.active-page {
            background-color: #0d6efd;
            color: #ffffff !important;
            border-color: #0d6efd;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Top Header Bar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold mb-0 h1">
                <i class="bi bi-shield-check text-primary"></i> InternPortal
            </span>
        </div>
    </nav>

    <div class="container">
        <!-- Flash Notification Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="row">
            <div class="col-md-4 col-lg-3">
                <div class="menu-container">
                    <h6 class="text-muted fw-bold text-uppercase mb-3">Portal Operations</h6>
                    
                    <a class="vertical-menu-btn {% if request.path == '/tasks' or request.path == '/' %}active-page{% endif %}" href="{{ url_for('tasks_page') }}">
                        <i class="bi bi-list-task me-2"></i> Tasks
                    </a>
                    
                    <a class="vertical-menu-btn {% if request.path == '/attendance' %}active-page{% endif %}" href="{{ url_for('attendance_page') }}">
                        <i class="bi bi-calendar-check me-2"></i> Attendance
                    </a>
                    
                    <a class="vertical-menu-btn {% if request.path == '/progress' %}active-page{% endif %}" href="{{ url_for('progress_page') }}">
                        <i class="bi bi-speedometer2"></i> Analytics & Progress
                    </a>
                    
                </div>
            </div>

            <div class="col-md-8 col-lg-9">
                <div class="bg-white p-4 rounded shadow-sm">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://jsdelivr.net" integrity="sha384-C6RzsnUH9E27X6MrcO2O9G7mG4hdBw8ED+I7E253cV3rYmetal9gvn6CH3gpMO5bh" crossorigin="anonymous"></script>
</body>
</html>
