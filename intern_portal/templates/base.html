<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Intern Management Suite</title>
    <!-- Stable Bootstrap 5.3.2 CSS CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
        .card { border: none; border-radius: 12px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
    </style>
</head>
<body>

    <!-- Professional Navbar with Explicit White Back Button -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3 mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{{ url_for('home.index') }}">
                <i class="bi bi-grid-1x2-fill text-primary me-2"></i> CorePortal
            </a>
            {% if request.path != '/' %}
            <div class="ms-auto">
                <!-- Explicit High Contrast Button to Go Home -->
                <a href="{{ url_for('home.index') }}" class="btn btn-danger btn-md fw-bold shadow d-flex align-items-center text-white px-3">
                    <i class="bi bi-arrow-left-circle-fill me-2"></i> BACK TO HOME SCREEN
                </a>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i> {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS Bundle for Interactivity -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
