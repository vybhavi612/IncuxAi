<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">
    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .container{
            width:700px;
            margin:auto;
            margin-top:50px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            text-align:center;
            color:#0077b6;
        }

        .info{
            font-size:20px;
            margin:15px;
        }

        button{
            padding:10px 20px;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Student Dashboard</h1>

<div class="info">
<strong>Name:</strong> {{ student[0] }}
</div>

<div class="info">
<strong>Email:</strong> {{ student[1] }}
</div>

<div class="info">
<strong>Login Time:</strong> {{ student[2] }}
</div>

<div class="info">
<strong>Logout Time:</strong> {{ student[3] }}
</div>

<div class="info">
<strong>Idle Duration:</strong> {{ student[4] }} Minute(s)
</div>

<div class="info">
<strong>Status:</strong> {{ student[5] }}
</div>

<form action="/logout">
    <button type="submit">
        Logout
    </button>
</form>

</div>

<script src="{{ url_for('static',
filename='tracker.js') }}"></script>

</body>
</html>
