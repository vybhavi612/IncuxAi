<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{
            background-color: rgb(223, 244, 244);
        }

        form{
            box-shadow: 5px 5px 5px 5px rgb(180, 248, 248);
            border-radius: 15px;
            color:rgb(1, 58, 59);
        }

        .frm{
            background-color:rgb(30, 176, 178);
            color:rgb(1, 58, 59);
        }

        .userCard{

            background-color: white;

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 30px;

            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);

        }

        .userHeader{

            display: flex;

            justify-content: space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

        }

        .userBadge{

            background-color: rgb(30,176,178);

            color: white;

            padding: 10px 18px;

            border-radius: 20px;

            font-weight: bold;

        }

        .sessionBox{

            background-color: rgb(240,252,252);

            border-radius: 15px;

            padding: 20px;

            margin-top: 20px;

            border-left: 6px solid rgb(3,147,152);

        }

        .taskBox{

            background-color: white;

            border-radius: 10px;

            padding: 12px;

            margin-top: 10px;

        }

        .status{

            padding: 8px 15px;

            border-radius: 20px;

            color: white;

            font-size: 14px;

            font-weight: bold;

        }

        .active{
            background-color: orange;
        }

        .completed{
            background-color: green;
        }

        a{
            color: rgb(3,147,152);
            word-break: break-word;
        }

        h1,h2,h5{
            font-weight: bold;
        }

        

    </style>

</head>

<body>

<form class="frm w-75 mx-auto my-auto mt-5 p-4" id="Admin">

    <h1 class="text-center mb-5">Admin Dashboard</h1>

    <div id="allUsersData"></div>

</form>

<script>

let usersContainer =
document.getElementById("allUsersData");

async function loadAdminData()
{

    let response =
    await fetch(
        "http://localhost:5000/admin-data"
    );

    let users =
    await response.json();

    if(users.length === 0)
    {

        usersContainer.innerHTML =
        "<h2 class='text-center'>No Users Found</h2>";

        return;

    }

    users.forEach(user => {

        let sessionHTML = "";

        if(user.history.length === 0)
        {

            sessionHTML =
            "<p>No Login History</p>";

        }

        else
        {

            user.history.forEach((item,index)=>{

                let login =
                new Date(item.login);

                let logout =
                item.logout
                ? new Date(item.logout)
                : null;

                let totalTime =
                "Active Session";

                if(logout)
                {

                    let diff =
                    logout - login;

                    let hours =
                    Math.floor(
                        diff/(1000*60*60)
                    );

                    let minutes =
                    Math.floor(
                        (diff%(1000*60*60))
                        /(1000*60)
                    );

                    let seconds =
                    Math.floor(
                        (diff%(1000*60))
                        /1000
                    );

                    totalTime =
                    `${hours}h ${minutes}m ${seconds}s`;

                }

                let taskHTML = "";

                if(user.tasks.length > 0)
                {

                    user.tasks.forEach(task=>{

                        taskHTML += `

                        <div class="taskBox">

                            <p>

                            <strong>Github:</strong>

                            <a href="${task.github}"
                            target="_blank">

                            ${task.github}

                            </a>

                            </p>

                            <p>

                            <strong>Description:</strong>

                            ${task.desc}

                            </p>

                            <p>

                            <strong>Added Time:</strong>

                            ${task.time}

                            </p>

                        </div>

                        `;

                    });

                }

                else
                {

                    taskHTML =
                    "<p>No Tasks Added</p>";

                }

                sessionHTML += `

                <div class="sessionBox">

                    <div class="d-flex justify-content-between align-items-center flex-wrap">

                        <h5>
                        Session ${index+1}
                        </h5>

                        <span class="status
                        ${logout ? 'completed' : 'active'}">

                        ${
                            logout
                            ? "Completed"
                            : "Active"
                        }

                        </span>

                    </div>

                    <hr>

                    <div class="row sessionRow">

                        <div class="col-md-4">

                            <p>
                            <strong>Login Time</strong>
                            </p>

                            <p>
                            ${login.toLocaleString()}
                            </p>

                        </div>

                        <div class="col-md-4">

                            <p>
                            <strong>Logout Time</strong>
                            </p>

                            <p>

                            ${
                                logout
                                ? logout.toLocaleString()
                                : "Not Logged Out"
                            }

                            </p>

                        </div>

                        <div class="col-md-4">

                            <p>
                            <strong>Total Time</strong>
                            </p>

                            <p>
                            ${totalTime}
                            </p>

                        </div>

                    </div>

                    <hr>

                    <h6 class="fw-bold">
                    Tasks
                    </h6>

                    ${taskHTML}

                </div>

                `;

            });

        }

        usersContainer.innerHTML += `

        <div class="userCard">

            <div class="userHeader">

                <div>

                    <h2>
                    ${user.name}
                    </h2>

                    <p>

                    <strong>Email:</strong>

                    ${user.email}

                    </p>

                    <p>

                    <strong>College:</strong>

                    ${user.college}

                    </p>

                    <p>

                    <strong>Phone:</strong>

                    ${user.phone}

                    </p>

                </div>

                <div>

                    <span class="userBadge">
                    User
                    </span>

                </div>

            </div>

            <hr>

            ${sessionHTML}

        </div>

        `;

    });

}

loadAdminData();

</script>



</body>
</html>
