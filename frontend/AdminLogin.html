<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <script src="admin.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{

            background-color: rgb(223,244,244);

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }

        form{

            box-shadow:
            5px 5px 15px rgb(180,248,248);

            border-radius: 20px;

            color: rgb(1,58,59);

            width: 100%;
            max-width: 450px;

        }

        .frm{

            background-color: rgb(30,176,178);

            color: rgb(1,58,59);

            padding: 35px;

        }

        h1{

            font-weight: bold;

            margin-bottom: 35px;

        }

        .input-box{

            margin-bottom: 25px;

        }

        label{

            font-weight: bold;

            margin-bottom: 8px;

            display: block;

        }

        input{

            background-color: rgb(206,243,243);

            border: 2px solid rgb(3,147,152);

            border-radius: 10px;

            padding: 10px;

            width: 100%;

        }

        input:focus{

            outline: none;

            border: 2px solid rgb(1,58,59);

        }

        .btn{

            background-color: rgb(169,240,240);

            width: 100%;

            color: rgb(1,58,59);

            border: 2px solid rgb(3,147,152);

            font-weight: bold;

            padding: 10px;

            border-radius: 10px;

            transition: 0.3s;

            margin-top: 10px;

        }

        .btn:hover{

            background-color: rgb(165,227,227);

            border: 2px solid rgb(3,147,152);

        }

        #nameError,
        #pswError{

            color: red;

            font-size: 14px;

            margin-top: 5px;

        }

        

        

    </style>

</head>

<body>

<form action=""
class="frm"
id="Admin">

    <h1 class="text-center">

        Admin Login

    </h1>

    <div class="input-box">

        <label for="Username"
        class="form-label fs-5">

            Name

        </label>

        <input type="text"
        id="name"
        placeholder="Enter Name">

        <div id="nameError"></div>

    </div>

    <div class="input-box">

        <label for="Password"
        class="form-label fs-5">

            Password

        </label>

        <input type="password"
        id="password"
        placeholder="Enter Password">

        <div id="pswError"></div>

    </div>

    <button class="btn">

        Let's Go

    </button>

</form>
       
<script>

document.getElementById("Admin")
.addEventListener("submit", async function (e) {

    e.preventDefault();

    let name =
    document.getElementById("name").value.trim();

    let password =
    document.getElementById("password").value.trim();

    let nameError =
    document.getElementById("nameError");

    let pswError =
    document.getElementById("pswError");

    nameError.innerHTML = "";
    pswError.innerHTML = "";

    if(name === "")
    {
        nameError.innerHTML =
        "Enter admin name";

        return;
    }

    if(password === "")
    {
        pswError.innerHTML =
        "Enter password";

        return;
    }

    let response = await fetch(

        "http://localhost:5000/admin-login",

        {

            method : "POST",

            headers : {
                "Content-Type" : "application/json"
            },

            body : JSON.stringify({

                name : name,

                password : password

            })

        }

    );

    let data = await response.json();

    alert(data.message);

    if(data.success)
    {

        sessionStorage.setItem(

            "admin",

            data.admin.name

        );

        window.location.href =
        "AdminDashboard.html";

    }

});

</script>
  
</body>
</html>
