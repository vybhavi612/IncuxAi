<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            margin: 0;

            background-color: rgb(239,249,249);

        }

        .hd{

            background-color: rgb(21,146,146);

            color: rgb(2,66,66);

            padding: 15px 20px;

        }

        img{

            height: 80px;

            width: 80px;

            object-fit: cover;

        }

        .items{

            color: rgb(186,236,236);

            gap: 10px;

        }

        a{

            text-decoration: none;

            color: inherit;

        }

        .nav-item-box{

            padding: 10px 15px;

            border-radius: 12px;

            transition: 0.3s;

            font-size: 18px;

            font-weight: bold;

        }

        .nav-item-box:hover{

            background-color: rgb(22,120,120);

            color: rgb(3,49,49);

        }

        footer{

            background-color: rgb(21,146,146);

            margin-top: auto;

            height: 50px;

        }

        .attendance-box{

            background-color: white;

            border-radius: 20px;

            padding: 30px;

            box-shadow:
            0px 4px 12px rgba(0,0,0,0.1);

        }

        .task-card{

            background-color: rgb(222,245,245);

            border: 2px solid rgb(21,146,146);

            border-radius: 15px;

            padding: 20px;

            margin-top: 20px;

            transition: 0.3s;

            word-wrap: break-word;

        }

        .task-card:hover{

            transform: translateY(-4px);

            box-shadow:
            0px 5px 12px rgba(0,0,0,0.1);

        }

        .task-card h5{

            color: rgb(3,49,49);

            font-weight: bold;

            margin-bottom: 15px;

        }

        .task-card p{

            margin: 8px 0;

            font-size: 16px;

        }

        footer{

            background-color: rgb(21,146,146);

        }

        


    </style>

</head>

<body>

    <header class="hd d-flex justify-content-between align-items-center">

        <div>

            <img src="incuxAI.jpg"
            alt="Logo">

        </div>

        <div class="items d-flex justify-content-evenly align-items-center">

            <div class="nav-item-box">

                <a href="login.html">
                    Login
                </a>

            </div>

            <div class="nav-item-box">

                <a href="History.html">
                    History
                </a>

            </div>

            <div class="nav-item-box">

                <a href="AddTask.html">
                    Add Task
                </a>

            </div>

            <div class="nav-item-box">

                <a href="Logout.html">
                    Logout
                </a>

            </div>

        </div>

    </header>

    <main class="container my-5">

        <div class="attendance-box">

            <h2 class="text-center mb-4">

                Task Updates

            </h2>

            <div id="taskList"></div>

        </div>

    </main>

    <footer></footer>

<script>

let currentUser =
sessionStorage.getItem("currentUser");

if(!currentUser)
{

    alert("Please Login First");

    window.location.href =
    "login.html";

}

let taskList =
document.getElementById("taskList");

async function loadTasks()
{

    try
    {

        taskList.innerHTML = "";

        let response = await fetch(

            `http://localhost:5000/tasks/${currentUser}`

        );

        let tasks = await response.json();

        console.log(tasks);

        if(tasks.length === 0)
        {

            taskList.innerHTML =
            "<h3>No Tasks Added</h3>";

        }

        else
        {

            tasks.forEach((task,index)=>{

                taskList.innerHTML += `

                <div class="task-card">

                    <h5>

                    Task ${index + 1}

                    </h5>

                    <p>

                    <strong>Github:</strong>

                    <a href="${task.github}"
                    target="_blank">

                    ${task.github}

                    </a>

                    </p>

                    <p>

                    <strong>Description:</strong>

                    ${task.desc}

                    </p>

                    <p>

                    <strong>Updated Time:</strong>

                    ${task.time}

                    </p>

                </div>

                `;

            });

        }

    }

    catch(err)
    {

        console.log(err);

        taskList.innerHTML =
        "<h3>Error Loading Tasks</h3>";

    }

}

loadTasks();

</script>

</body>
</html>
