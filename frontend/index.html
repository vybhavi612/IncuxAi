<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <button id="darkModeBtn">

        Dark Mode

    </button>

    <div class="container">

        <h1>Student Login</h1>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">

                Login

            </button>

        </form>

        <p class="switch-page">

            New Student?

            <a href="register.html">

                Register

            </a>

        </p>

    </div>

    <script src="js/login.js"></script>

    <script src="js/darkmode.js"></script>

</body>
</html>
