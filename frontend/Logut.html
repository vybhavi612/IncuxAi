<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Logout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{

            background-color: rgb(223,244,244);

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .logout-box{

            background-color: rgb(30,176,178);

            padding: 40px;

            border-radius: 20px;

            text-align: center;

            width: 100%;

            max-width: 450px;

            box-shadow:
            5px 5px 15px rgb(180,248,248);

            color: rgb(1,58,59);

        }

        h2{

            font-weight: bold;

            margin-bottom: 25px;

        }

        p{

            font-size: 18px;

            margin-bottom: 30px;

        }

        .btn-logout{

            background-color: rgb(169,240,240);

            color: rgb(1,58,59);

            border: 2px solid rgb(3,147,152);

            font-weight: bold;

            padding: 10px 25px;

            border-radius: 10px;

            transition: 0.3s;

        }

        .btn-logout:hover{

            background-color: rgb(44,185,185);

            color: white;

        }

    </style>

</head>

<body>

    <div class="logout-box">

        <h2>
            Logout
        </h2>

        <p>
            Click below to logout from TrackTime
        </p>

        <button class="btn-logout"
        onclick="logoutUser()">

            Logout

        </button>

    </div>

<script>

async function logoutUser()
{

    let currentUser =
    sessionStorage.getItem("currentUser");

    if(!currentUser)
    {

        alert("No User Logged In");

        window.location.href =
        "login.html";

        return;

    }

    try
    {

        let response = await fetch(

            `http://localhost:5000/logout-history/${currentUser}`,

            {

                method : "PUT",

                headers : {

                    "Content-Type" : "application/json"

                }

            }

        );

        let data = await response.json();

        console.log(data);

        sessionStorage.removeItem("currentUser");

        alert("Logout Successful");

        window.location.href =
        "login.html";

    }

    catch(err)
    {

        console.log(err);

        alert("Logout Failed");

    }

}

</script>

</body>

</html>
