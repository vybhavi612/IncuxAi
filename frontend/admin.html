
<!DOCTYPE html>
<html>
<head>

<title>Admin Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<span class="navbar-brand">

Admin Dashboard

</span>

</div>

</nav>

<div class="container mt-4">

<div class="card shadow">

<div class="card-body">

<h3>Registered Students</h3>

<hr>

<table class="table table-bordered">

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Department</th>

</tr>

</thead>

<tbody>

<tr>

<td>Student 1</td>

<td>student1@gmail.com</td>

<td>CSE</td>

</tr>

<tr>

<td>Student 2</td>

<td>student2@gmail.com</td>

<td>ECE</td>

</tr>

</tbody>

</table>

</div>

</div>

<br>

<div class="card shadow">

<div class="card-body">

<h3>Attendance Records</h3>

<hr>

<table class="table table-bordered">

<thead>

<tr>

<th>Name</th>

<th>Login Time</th>

<th>Logout Time</th>

<th>Time Spent</th>

</tr>

</thead>

<tbody id="attendanceTable">

</tbody>

</table>

</div>

</div>

<br>

<div class="card shadow">

<div class="card-body">

<h3>Assignments</h3>

<hr>

<table class="table table-bordered">

<thead>

<tr>

<th>Student</th>

<th>Title</th>

<th>GitHub Link</th>

<th>Status</th>

</tr>

</thead>

<tbody id="adminAssignmentTable">

</tbody>

</table>

</div>

</div>

</div>

<script>

if(
sessionStorage.getItem(
"adminLoggedIn"
) !== "true"
){

alert(
"Please Login First"
);

window.location.href =
"admin-login.html";

}

</script>

<script>

function loadAdminAssignments(){

const assignments =

JSON.parse(
localStorage.getItem(
"assignments"
)
) || [];

let rows = "";

assignments.forEach(
function(item){

rows +=

`
<tr>

<td>${item.studentName}</td>

<td>${item.title}</td>

<td>
<a href="${item.github}"
target="_blank">

Repository

</a>
</td>

<td class="text-success">
Submitted
</td>

</tr>
`;

}
);

document.getElementById(
"adminAssignmentTable"
).innerHTML = rows;

}

function loadAttendance(){

const name =
localStorage.getItem(
"studentName"
);

const loginTime =
localStorage.getItem(
"loginTime"
);

const logoutTime =
localStorage.getItem(
"logoutTime"
);

const timeSpent =
localStorage.getItem(
"timeSpent"
);

const row =

`
<tr>

<td>${name || "-"}</td>

<td>${loginTime || "-"}</td>

<td>${logoutTime || "-"}</td>

<td>${timeSpent || "-"}</td>

</tr>
`;

document.getElementById(
"attendanceTable"
).innerHTML = row;

}

loadAttendance();

loadAdminAssignments();

</script>

</body>
</html>
