<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <button id="darkModeBtn">

        Dark Mode

    </button>

    <div class="dashboard-container">

        <h1>Admin Dashboard</h1>

        <div class="analytics-container">

            <div class="analytics-card">

                <h3>Total Students</h3>

                <h2 id="totalStudents">

                    0

                </h2>

            </div>

            <div class="analytics-card">

                <h3>Present Students</h3>

                <h2 id="presentStudents">

                    0

                </h2>

            </div>

            <div class="analytics-card">

                <h3>Late Students</h3>

                <h2 id="lateStudents">

                    0

                </h2>

            </div>

            <div class="analytics-card">

                <h3>Total Records</h3>

                <h2 id="totalRecords">

                    0

                </h2>

            </div>

        </div>

        <div class="card">

            <h2>Attendance Records</h2>

            <table id="attendanceTable">

                <thead>

                    <tr>

                        <th>Student</th>

                        <th>Status</th>

                        <th>First Login</th>

                        <th>Last Login</th>

                        <th>Login Count</th>

                        <th>Delay</th>

                        <th>Logout</th>

                        <th>Session</th>

                        <th>Work Status</th>

                        <th>Login History</th>

                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

    </div>

    <script src="js/admin.js"></script>

    <script src="js/darkmode.js"></script>

</body>
</html>
