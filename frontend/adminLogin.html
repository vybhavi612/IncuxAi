<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<button id="darkModeBtn">

    Dark Mode

</button>

<div class="container">

    <h1>Admin Login</h1>

    <form id="adminLoginForm">

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">

            Login

        </button>

    </form>

</div>

<script src="js/adminLogin.js"></script>

<script src="js/darkmode.js"></script>

</body>
</html>
