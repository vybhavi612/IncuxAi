<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SmartTracker</title>
  </head>
  <body>
    <p>Opening SmartTracker...</p>
    <script>
      fetch("index.html")
        .then((response) => response.text())
        .then((html) => {
          document.open();
          document.write(html);
          document.close();
          history.replaceState(null, "", "smartracker.html");
        });
    </script>
  </body>
</html>
