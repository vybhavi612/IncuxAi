{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-7">

<div class="card shadow">

<div class="card-header text-center">

<h3>Create Account</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Full Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control"
required>

</div>

<div class="mb-3">

<label>College</label>

<input
type="text"
name="college"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Department</label>

<input
type="text"
name="department"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Year</label>

<input
type="text"
name="year"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
class="form-control"
required>

</div>

<div class="d-grid">

<button class="btn btn-primary">

Register

</button>

</div>

</form>

<hr>

<p class="text-center">

Already have an account?

<a href="/login">

Login

</a>

</p>

</div>

</div>

</div>

</div>

{% endblock %}
